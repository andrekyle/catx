{% extends "lms_base.html" %}
{% block title %}{% if course %}Edit{% else %}New{% endif %} Course - Admin{% endblock %}
{% block content %}
<div style="margin-bottom:24px;">
    <a href="{{ url_for('admin_courses') }}" style="color:var(--blue); text-decoration:none; font-size:14px; font-weight:500; display:inline-flex; align-items:center; gap:5px; letter-spacing:-0.1px;">
        <i class="fas fa-chevron-left" style="font-size:11px;"></i> Courses
    </a>
    <h1 class="sf-title" style="margin-top:10px;">{% if course %}Edit Course{% else %}New Course{% endif %}</h1>
</div>
<div class="card" style="max-width:600px; padding:28px 26px;">
    <form method="POST">
        <div class="form-group">
            <label class="form-label">Title</label>
            <input type="text" name="title" class="form-control" value="{{ course.title if course else '' }}" required placeholder="Course title">
        </div>
        <div class="form-group">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3" placeholder="Brief course description">{{ course.description if course else '' }}</textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Grade</label>
            <select name="grade_id" class="form-control" required>
                {% for g in grades %}
                <option value="{{ g.id }}" {% if course and course.grade_id == g.id %}selected{% endif %}>{{ g.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;">
            <div class="form-group">
                <label class="form-label">Icon (FA)</label>
                <input type="text" name="icon" class="form-control" value="{{ course.icon if course else 'fa-book' }}" placeholder="fa-book">
            </div>
            <div class="form-group">
                <label class="form-label">Color</label>
                <input type="color" name="color" class="form-control" value="{{ course.color if course else '#007AFF' }}" style="height:42px; padding:4px;">
            </div>
            <div class="form-group">
                <label class="form-label">Order</label>
                <input type="number" name="order" class="form-control" value="{{ course.order if course else 0 }}">
            </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:13px;"><i class="fas fa-check"></i> {% if course %}Update{% else %}Create{% endif %} Course</button>
    </form>
</div>
{% endblock %}
