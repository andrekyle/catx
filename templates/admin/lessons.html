{% extends "lms_base.html" %}
{% block title %}Manage Lessons - Admin{% endblock %}
{% block content %}
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:10px;">
    <h1 class="sf-title"><i class="fas fa-file-lines" style="color:var(--green);"></i> Lessons</h1>
    <a href="{{ url_for('admin_lesson_create') }}" class="btn btn-primary btn-sm"><i class="fas fa-plus"></i> New Lesson</a>
</div>
<div class="card" style="overflow:hidden;">
    <table style="width:100%; font-size:14px; border-collapse:collapse;">
        <thead>
            <tr style="background:var(--fill-secondary);">
                <th style="padding:12px 16px; text-align:left; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-secondary);">Title</th>
                <th style="padding:12px; text-align:left; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-secondary);">Course</th>
                <th style="padding:12px; text-align:left; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-secondary);">Order</th>
                <th style="padding:12px; text-align:left; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-secondary);">Actions</th>
            </tr>
        </thead>
        <tbody>
        {% for lesson in lessons %}
        <tr style="border-top:0.5px solid var(--separator-light);">
            <td style="padding:12px 16px;"><strong style="letter-spacing:-0.2px;">{{ lesson.title }}</strong></td>
            <td style="padding:12px;"><span class="badge badge-info">{{ lesson.course.title }}</span></td>
            <td style="padding:12px;">{{ lesson.order }}</td>
            <td style="padding:12px;">
                <div style="display:flex; gap:6px;">
                    <a href="{{ url_for('admin_lesson_edit', lesson_id=lesson.id) }}" class="btn btn-ghost btn-sm"><img src="{{ url_for('static', filename='images/edit.png') }}" alt="Edit" width="14" height="14"></a>
                    <form method="POST" action="{{ url_for('admin_lesson_delete', lesson_id=lesson.id) }}" onsubmit="return confirm('Delete this lesson?')">
                        <button type="submit" class="btn btn-danger btn-sm"><i class="fas fa-trash"></i></button>
                    </form>
                </div>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
