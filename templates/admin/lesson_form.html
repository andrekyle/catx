{% extends "lms_base.html" %}
{% block title %}{% if lesson %}Edit{% else %}New{% endif %} Lesson - Admin{% endblock %}
{% block content %}
<div style="margin-bottom:24px;">
    <a href="{{ url_for('admin_lessons') }}" style="color:var(--blue); text-decoration:none; font-size:14px; font-weight:500; display:inline-flex; align-items:center; gap:5px; letter-spacing:-0.1px;">
        <i class="fas fa-chevron-left" style="font-size:11px;"></i> Lessons
    </a>
    <h1 class="sf-title" style="margin-top:10px;">{% if lesson %}Edit Lesson{% else %}New Lesson{% endif %}</h1>
</div>
<div class="card" style="max-width:680px; padding:28px 26px;">
    <form method="POST">
        <div class="form-group">
            <label class="form-label">Title</label>
            <input type="text" name="title" class="form-control" value="{{ lesson.title if lesson else '' }}" required>
        </div>
        <div class="form-group">
            <label class="form-label">Course</label>
            <select name="course_id" class="form-control" required>
                {% for c in courses %}
                <option value="{{ c.id }}" {% if lesson and lesson.course_id == c.id %}selected{% endif %}>{{ c.title }} ({{ c.grade.name }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Content (HTML)</label>
            <textarea name="content" class="form-control" rows="12" style="font-family:'SF Mono', Consolas, monospace; font-size:13px;">{{ lesson.content if lesson else '' }}</textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Order</label>
            <input type="number" name="order" class="form-control" value="{{ lesson.order if lesson else 0 }}">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:13px;"><i class="fas fa-check"></i> {% if lesson %}Update{% else %}Create{% endif %} Lesson</button>
    </form>
</div>
{% endblock %}
